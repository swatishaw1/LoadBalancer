spring.application.name=java-load-balancer
server.port=9090

load-balancer.algorithm=WEIGHTED_ROUND_ROBIN
load-balancer.max-attempts=100000
# Light task servers
load-balancer.servers.light-urls=${LIGHT_SERVERS:http://localhost:8080,http://localhost:8082}

# Heavy task servers
load-balancer.servers.heavy-urls=${HEAVY_SERVERS:http://localhost:8081,http://localhost:8083}

load-balancer.health-check-interval-ms=60000

load-balancer.http-client.connect-timeout-ms=10000000
load-balancer.http-client.read-timeout-ms=100000