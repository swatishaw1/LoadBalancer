spring.application.name=java-load-balancer
server.port=9090

load-balancer.algorithm=LEAST_RESPONSE_TIME
load-balancer.max-attempts=3
# Light task servers
load-balancer.servers.light-urls=${LIGHT_SERVERS:http://localhost:8080,http://localhost:8082}

# Heavy task servers
load-balancer.servers.heavy-urls=${HEAVY_SERVERS:http://localhost:8081,http://localhost:8083}

load-balancer.health-check-interval-ms=60000

load-balancer.http-client.connect-timeout-ms=1000
load-balancer.http-client.read-timeout-ms=2000
algorithm.high.utilization.threshold=0.70
algorithm.high.latency.threshold=500
algorithm.imbalance.threshold=0.25
# Algorithm monitor evaluation interval
load-balancer.algorithm-monitor.interval-ms=5000

# Require stable recommendation before switching
algorithm.switching.threshold=3

# Cooldown between algorithm switches (30 seconds)
algorithm.switching.cooldown.period=30000